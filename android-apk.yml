name: Compilar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências do projeto
        run: npm install
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/android && npm install --save-dev @capacitor/cli
      - name: Criar projeto Android
        run: npx cap add android
      - name: Sincronizar site com Android
        run: npx cap sync android
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Compilar APK de instalação
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Lume-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
